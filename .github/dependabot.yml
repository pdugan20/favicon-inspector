version: 2
updates:
  - package-ecosystem: npm
    cooldown: { default-days: 7 }
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    cooldown: { default-days: 14 }
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
