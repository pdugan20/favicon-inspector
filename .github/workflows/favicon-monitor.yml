name: Favicon Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Capture snapshot, fail on ALERT
        run: npm start -- --fail-on alert
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: favicon-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
